[project]
name = "goi-env"
version = "0.1.0"
description = "Gymnasium environment for Getting Over It with Bennett Foddy, via the GOI RL Bridge BepInEx plugin"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.24"]
license = "MIT"

[project.optional-dependencies]
train = [
    "imageio[ffmpeg]>=2.37.4",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]
# The Box2D port in JAX (goi_jax/box2d) and its tests (tests/box2d), in WSL or Linux (jax 0.12 needs Python 3.12+).
# For NVIDIA GPUs install jax[cuda13]==0.12.0.
jax = [
    "jax==0.12.0; python_version >= '3.12'",
    "pytest>=8",
]

# PyPI's Windows torch wheels are CPU-only. The CUDA 13.0 build trains the big policy (--net big --device cuda) ~10x
# faster than the CPU, and still runs everything on the CPU without a GPU.
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
